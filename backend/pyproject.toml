[project]
name = "deepsearch-ai"
version = "0.1.0"
description = "Multi-Agent AI Research & Knowledge Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "qdrant-client>=1.9.0",
    "email-validator>=2.1.1",
    "langgraph>=0.0.60",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchain-qdrant>=0.1.0",
    "langchain-huggingface>=0.1.0",
    "langchain-community>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "arxiv>=2.1.0",
    "wikipedia>=1.4.0",
    "tavily-python>=0.3.3",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "langfuse>=2.30.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "black>=24.4.2",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
